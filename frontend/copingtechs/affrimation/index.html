<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positive Affirmations Technique</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-inner">
                <h1>Positive Affirmations Ritual</h1>
                <img src="assets/Coping_image/affirmation.png" alt="Affirmations" class="technique-image">
            </div>
        </div>
        <div class="content">
            <div class="affirmation-list" id="affirmationList">
                <!-- Affirmation list will be populated here -->
            </div>
            <div class="affirmation-display" id="affirmationDisplay">
                <p class="instruction-lead">Breathe deeply, clear your mind, and repeat each affirmation with calm conviction:</p>
                <p class="affirmation-title" id="affirmationTitle"></p>
                <p class="affirmation-sentence" id="affirmationSentence"></p>
                <div class="button-row">
                    <button id="startButton">Play</button>
                    <button id="doneButton" disabled>Done</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
